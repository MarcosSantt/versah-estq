<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Versah | EstoqueControl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════ Design tokens ═══════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8FAFC;  --surface: #FFFFFF;  --surface-2: #F1F5F9;
      --border: #E2E8F0;  --border-strong: #CBD5E1;
      --text: #0F172A;  --text-2: #475569;  --text-3: #64748B;
      --primary: #2563EB;  --primary-h: #1D4ED8;  --primary-bg: #EFF6FF;
      --brand: #C3A365;
      --green: #15803D;  --green-bg: #DCFCE7;  --green-bar: #22C55E;
      --amber: #B45309;  --amber-bg: #FEF3C7;  --amber-bar: #F59E0B;
      --red: #B91C1C;    --red-bg: #FEE2E2;    --red-bar: #EF4444;
      --radius: 12px;  --radius-sm: 8px;
      --shadow: 0 1px 2px rgba(15,23,42,.04);
      --shadow-lg: 0 12px 40px rgba(15,23,42,.14);
      --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --sidebar-w: 248px;
      --t: 140ms ease;
    }
    html { -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; min-height: 100vh; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .skip { position: absolute; left: -999px; top: 8px; background: var(--text); color: #fff; padding: 8px 12px; border-radius: 8px; z-index: 999; }
    .skip:focus { left: 8px; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
    .ico { flex-shrink: 0; }
    .num { font-variant-numeric: tabular-nums; }

    /* ═══════════════ Layout ═══════════════ */
    .shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
      position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; z-index: 60;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 16px; }
    .brand b { font-size: 15px; font-weight: 700; letter-spacing: -.01em; display: block; line-height: 1.2; }
    .brand small { color: var(--text-3); font-size: 11.5px; }
    .nav-group { margin-top: 14px; }
    .nav-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); padding: 0 10px 4px; }
    .nav-link {
      display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-sm);
      color: var(--text-2); font-weight: 500; transition: background var(--t), color var(--t);
    }
    .nav-link:hover { background: var(--surface-2); color: var(--text); }
    .nav-link.active { background: var(--primary-bg); color: var(--primary); }
    .nav-link .ico { opacity: .85; }
    .nav-sub { padding-left: 38px; font-size: 13.5px; }
    .nav-badge { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--red-bg); color: var(--red); }
    .nav-badge.neutral { background: var(--surface-2); color: var(--text-2); }
    .scrim { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 55; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 28px;
      background: rgba(248,250,252,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    }
    .searchbox {
      flex: 1; min-width: 0; max-width: 440px; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text-3); text-align: left;
      transition: border-color var(--t);
    }
    .searchbox:hover { border-color: var(--border-strong); }
    .searchbox span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    kbd { font: 500 11px var(--font); padding: 2px 6px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
    .top-actions { margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      position: relative; width: 38px; height: 38px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-2); transition: background var(--t);
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .bell-dot { position: absolute; top: 7px; right: 7px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--red-bar); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--text); color: #fff; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
    .pop-wrap { position: relative; }
    .popover {
      position: absolute; right: 0; top: calc(100% + 8px); width: 320px; max-width: calc(100vw - 24px); background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 6px; z-index: 70;
      animation: pop .14s ease;
    }
    .popover[hidden] { display: none; }
    .pop-head { padding: 8px 10px; font-weight: 600; font-size: 13px; }
    .pop-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); text-align: left; }
    .pop-item:hover { background: var(--surface-2); }
    .pop-item small { color: var(--text-3); display: block; }
    .pop-sep { height: 1px; background: var(--border); margin: 6px 0; }
    #view { padding: 28px; max-width: 1240px; width: 100%; margin: 0 auto; outline: none; }
    #view.anim > * { animation: fadein .18s ease; }

    /* ═══════════════ Components ═══════════════ */
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .eyebrow { color: var(--text-3); font-size: 13px; margin-bottom: 2px; }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
    .sub { color: var(--text-3); margin-top: 2px; }
    h2 { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 20px; }
    .card-head p { color: var(--text-3); font-size: 13px; }
    .card-body { padding: 0 20px 20px; }
    .stack { display: flex; flex-direction: column; gap: 20px; }
    .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .grid-eq { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 9px;
      font-weight: 500; font-size: 13.5px; white-space: nowrap; border: 1px solid var(--border); background: var(--surface); color: var(--text);
      transition: background var(--t), border-color var(--t);
    }
    .btn:hover { background: var(--surface-2); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-h); }
    .btn.danger { background: var(--red-bar); border-color: var(--red-bar); color: #fff; }
    .btn.danger:hover { background: #DC2626; }
    .btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
    .btn.ghost:hover { background: var(--surface-2); }
    .btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .row-btn { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-3); transition: background var(--t), color var(--t); }
    .row-btn:hover { background: var(--surface-2); color: var(--text); }
    .row-btn.in:hover { background: var(--green-bg); color: var(--green); }
    .row-btn.out:hover, .row-btn.del:hover { background: var(--red-bg); color: var(--red); }

    /* Status */
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.normal, .pill.ok { background: var(--green-bg); color: var(--green); }
    .pill.atencao { background: var(--amber-bg); color: var(--amber); }
    .pill.critico { background: var(--red-bg); color: var(--red); }
    .pill.neutral { background: var(--surface-2); color: var(--text-2); }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); font-size: 12px; }
    .mv { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 6px; }
    .mv.in { background: var(--green-bg); color: var(--green); }
    .mv.out { background: var(--red-bg); color: var(--red); }
    .mv.adj { background: var(--surface-2); color: var(--text-2); }
    .qty-in { color: var(--green); font-weight: 600; }
    .qty-out { color: var(--red); font-weight: 600; }
    .bar { height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; width: 72px; margin-top: 5px; }
    .bar i { display: block; height: 100%; border-radius: 99px; transition: width .3s ease; }

    /* KPI */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .kpi { display: block; padding: 18px 20px; transition: border-color var(--t), box-shadow var(--t); }
    a.kpi:hover { border-color: var(--border-strong); box-shadow: 0 2px 8px rgba(15,23,42,.06); }
    .kpi-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .kpi-ico { width: 32px; height: 32px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--text-2); }
    .kpi.red .kpi-ico { background: var(--red-bg); color: var(--red); }
    .kpi.amber .kpi-ico { background: var(--amber-bg); color: var(--amber); }
    .kpi.green .kpi-ico { background: var(--green-bg); color: var(--green); }
    .kpi.blue .kpi-ico { background: var(--primary-bg); color: var(--primary); }
    .kpi-val { font-size: 32px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .kpi-label { font-weight: 500; margin-top: 4px; }
    .kpi-ctx { color: var(--text-3); font-size: 12.5px; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
    .delta { color: var(--green); font-weight: 600; }

    /* Summary banner */
    .summary { display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px; margin-bottom: 20px; background: var(--primary-bg); border-color: #DBEAFE; }
    .summary .kpi-ico { background: #fff; color: var(--primary); }
    .summary p { color: var(--text-2); }
    .summary strong { color: var(--text); }

    /* Tables */
    .tbl-wrap { overflow-x: auto; }
    table.rt { width: 100%; border-collapse: collapse; }
    .rt th { text-align: left; font-size: 12px; font-weight: 500; color: var(--text-3); padding: 10px 16px; background: var(--bg); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); white-space: nowrap; }
    .rt th.r, .rt td.r { text-align: right; }
    .rt th button { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; color: inherit; }
    .rt th button:hover { color: var(--text); }
    .rt td { padding: 12px 16px; border-bottom: 1px solid var(--surface-2); vertical-align: middle; }
    .rt tbody tr:last-child td { border-bottom: none; }
    .rt tbody tr { transition: background var(--t); }
    .rt tbody tr:hover { background: #FAFBFD; }
    .name-btn { font-weight: 500; text-align: left; color: var(--text); }
    .name-btn:hover { color: var(--primary); }
    .cell-actions { white-space: nowrap; text-align: right; }
    .muted { color: var(--text-3); }
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 13px; flex-wrap: wrap; }
    .pager div { display: flex; gap: 6px; }

    /* Filters / form controls */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 20px 16px; }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field > label, .lbl { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
    .input, select.input {
      width: 100%; height: 38px; padding: 0 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 9px; font-size: 14px;
      transition: border-color var(--t), box-shadow var(--t);
    }
    .input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .input-icon { position: relative; flex: 1; min-width: 200px; }
    .input-icon .ico { position: absolute; left: 11px; top: 10px; color: var(--text-3); }
    .input-icon .input { padding-left: 34px; }
    .filters select.input { width: auto; min-width: 150px; }
    .seg { display: inline-flex; padding: 3px; background: var(--surface-2); border-radius: 10px; gap: 2px; }
    .seg button { padding: 4px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-2); }
    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(15,23,42,.1); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    .with-btn { display: flex; gap: 8px; }
    .hint { background: var(--surface-2); border-radius: 9px; padding: 10px 12px; color: var(--text-2); font-size: 13px; }
    .hint strong { color: var(--text); }
    input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

    /* Empty / error / skeleton */
    .empty { text-align: center; padding: 44px 20px; color: var(--text-3); }
    .empty .em-ico { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; color: var(--text-3); }
    .empty h3 { color: var(--text); font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .empty p { max-width: 380px; margin: 0 auto 16px; }
    .empty.err .em-ico { background: var(--red-bg); color: var(--red); }
    .skel { background: linear-gradient(90deg, var(--surface-2), #E9EEF5, var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; border-radius: 8px; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* Chart */
    .an-tot { display: flex; gap: 24px; flex-wrap: wrap; padding: 0 20px 8px; }
    .an-tot b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
    .an-tot span { display: block; color: var(--text-3); font-size: 12.5px; }
    .legend { display: inline-flex; gap: 14px; font-size: 12.5px; color: var(--text-2); }
    .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
    .chart { padding: 0 12px 12px; }
    .chart svg { width: 100%; height: auto; display: block; }
    .chart text { font-family: var(--font); fill: var(--text-3); font-size: 11px; }
    .chart .hov { fill: transparent; }
    .chart g:hover .hov { fill: rgba(37,99,235,.06); }
    .rank { list-style: none; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 14px; }
    .rank li > div:first-child { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
    .rank-bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .rank-bar i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }

    /* Dialogs */
    dialog { border: none; padding: 0; background: transparent; color: var(--text); max-width: 100vw; }
    dialog::backdrop { background: rgba(15,23,42,.42); animation: fadein .14s ease; }
    dialog[open] { animation: pop .16s ease; }
    .dlg { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); width: min(520px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); overflow-y: auto; }
    .dlg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 22px 4px; }
    .dlg-head h2 { font-size: 17px; }
    .dlg-head p { color: var(--text-3); margin-top: 2px; }
    .dlg-body { padding: 14px 22px; }
    .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px 20px; flex-wrap: wrap; }
    .dlg.wide { width: min(640px, calc(100vw - 24px)); }
    dialog.drawer { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; }
    dialog.drawer[open] { animation: slide .2s ease; }
    dialog.drawer .dlg { width: min(480px, 100vw); height: 100dvh; max-height: 100dvh; border-radius: 16px 0 0 16px; display: flex; flex-direction: column; }
    dialog.drawer .dlg-body { flex: 1; overflow-y: auto; }
    .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
    .kv div { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .kv small { color: var(--text-3); font-size: 12px; display: block; }
    .kv b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tl { list-style: none; }
    .tl li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--surface-2); }
    .tl li:last-child { border-bottom: none; }
    .tl .d { color: var(--text-3); width: 44px; font-variant-numeric: tabular-nums; }
    .tl .q { width: 64px; font-variant-numeric: tabular-nums; }
    .tl .o { color: var(--text-3); margin-left: auto; text-align: right; font-size: 12.5px; }
    .list-box { border: 1px solid var(--border); border-radius: 10px; max-height: 240px; overflow-y: auto; margin-top: 12px; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--surface-2); }
    .list-row:last-child { border-bottom: none; }

    /* Command palette */
    dialog.palette { margin: 12vh auto 0; }
    .pal { width: min(600px, calc(100vw - 24px)); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; }
    .pal-in { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); color: var(--text-3); }
    .pal-in input { flex: 1; height: 52px; border: none; outline: none; background: transparent; font-size: 15px; color: var(--text); }
    .pal-list { max-height: 50vh; overflow-y: auto; padding: 6px; }
    .pal-group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--text-3); padding: 10px 10px 4px; }
    .pal-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 8px; text-align: left; color: var(--text-2); }
    .pal-item small { color: var(--text-3); margin-left: 4px; }
    .pal-item kbd { margin-left: auto; }
    .pal-item[aria-selected="true"] { background: var(--primary-bg); color: var(--primary); }
    .pal-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 12px; }

    /* Toasts */
    #toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; pointer-events: none; }
    .toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: var(--text); color: #fff; padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow-lg); font-weight: 500; max-width: 360px; animation: toast-in .2s ease; }
    .toast.error { background: #991B1B; }
    .toast.out { opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }

    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    /* Shop list extras */
    tr.done td:not(.cell-actions) { opacity: .55; }
    tr.done .name-btn, tr.done .nm { text-decoration: line-through; }
    .qty-input { width: 84px; height: 32px; text-align: right; }
    .add-row { display: grid; grid-template-columns: 1fr 110px 110px auto; gap: 10px; align-items: end; padding: 0 20px 16px; }

<script>
/* ═══════════════════════════════════════════════════════════
   Versah | EstoqueControl — frontend (JS puro, sem dependências)
   ═══════════════════════════════════════════════════════════ */
const API = (() => {
  const host = window.location.hostname;
  const protocol = window.location.protocol === 'https:' ? 'https' : 'http';
  return ['localhost', '127.0.0.1'].includes(host) ? `${protocol}://localhost:3000/api` : 'https://versah-backend.onrender.com/api';
})();
const HIST_LIMIT = 1000;
const PER_PAGE = 12, PER_PAGE_MOV = 20;
const LISTA_CAT_KEY = 'versah_lista_categorias';
const LISTA_UNI_KEY = 'versah_lista_unidades';
const DEF_CAT = 'Sem categoria', DEF_UNI = 'un';

/* ── Helpers ─────────────────────────────────────────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const num = n => (+(+n).toFixed(3)).toLocaleString('pt-BR');
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const pl = (n, a, b) => n === 1 ? a : b;
const fmtDM = d => new Date(d).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const fmtDMY = d => new Date(d).toLocaleDateString('pt-BR');
const fmtHM = d => new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const sameDay = (a, b) => a.toDateString() === b.toDateString();
function ago(d) {
  const diff = Math.floor((Date.now() - new Date(d)) / 864e5);
  if (diff <= 0) return 'hoje';
  if (diff === 1) return 'ontem';
  return `há ${diff} dias`;
}
const P = {
  home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', up:'<path d="M12 19V5M5 12l7-7 7 7"/>', down:'<path d="M12 5v14M19 12l-7 7-7-7"/>',
  swap:'<path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  chart:'<path d="M4 20V4M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-8"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>', check:'<path d="m5 12 5 5L20 7"/>',
  download:'<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  logout:'<path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9"/>',
  chevR:'<path d="m9 6 6 6-6 6"/>', chevL:'<path d="m15 6-6 6 6 6"/>', layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  file:'<path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"/><path d="M14 3v4h4"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  sortU:'<path d="m7 14 5-5 5 5"/>', sortD:'<path d="m7 10 5 5 5-5"/>', info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',
};
const ico = (n, s = 18) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ''}</svg>`;

/* ── Estado ──────────────────────────────────────────── */
const st = {
  user: null, items: [], rows: [], hist: [], loading: true, error: null, histNote: false,
  cats: [], unis: [],
  mat: { q: '', cat: '', status: 'todos', sort: 'nome', asc: true, page: 1 },
  mov: { tipo: 'todos', dias: 30, item: '', cat: '', page: 1 },
  period: 30,
  editId: null, movId: null, movTipo: null, mgKind: null,
};

/* ── Persistência local (categorias, unidades, lista de compras) ── */
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const shopKey = () => `versah_compras_${st.user?.id ?? 'x'}`;
let shop = { excluded: [], unchecked: [], bought: [], qty: {}, manual: [] };
const saveShop = () => lsSet(shopKey(), shop);

/* ── API ─────────────────────────────────────────────── */
const authHeaders = () => ({ 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('versah_token')}` });
async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: authHeaders() });
  if (res.status === 401) { logout(); throw new Error('Sessão expirada.'); }
  let data = null; try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error((data && data.erro) || 'Erro inesperado.');
  return data;
}
function logout() {
  localStorage.removeItem('versah_token'); localStorage.removeItem('versah_usuario');
  window.location.href = 'login.html';
}

/* ── Regras de negócio ───────────────────────────────── */
function calc(item) {
  const atual = parseFloat(item.atual) || 0, minimo = parseFloat(item.minimo) || 0, ideal = parseFloat(item.ideal) || 0;
  const status = atual <= minimo ? 'critico' : atual <= minimo * 1.25 ? 'atencao' : 'normal';
  return {
    ...item, atual, minimo, ideal, status,
    comprar: +Math.max(0, ideal - atual).toFixed(3),
    pct: ideal > 0 ? Math.min(100, Math.round(atual / ideal * 100)) : 0,
    categoria: item.categoria || DEF_CAT, unidade: item.unidade || DEF_UNI,
  };
}
const STATUS_LABEL = { critico: 'Crítico', atencao: 'Atenção', normal: 'Normal' };
const BAR_COLOR = { critico: 'var(--red-bar)', atencao: 'var(--amber-bar)', normal: 'var(--green-bar)' };
const statusPill = s => `<span class="pill ${s}">${STATUS_LABEL[s]}</span>`;
const byId = id => st.rows.find(r => r.id === id);
const risk = () => st.rows.filter(r => r.status !== 'normal').sort((a, b) => (a.status === b.status ? a.pct - b.pct : a.status === 'critico' ? -1 : 1));
function recalc() {
  st.rows = st.items.map(calc);
  // garante que categorias/unidades vindas do servidor existam nas listas locais
  let changed = false;
  st.rows.forEach(r => {
    if (!st.cats.includes(r.categoria)) { st.cats.push(r.categoria); changed = true; }
    if (!st.unis.includes(r.unidade)) { st.unis.push(r.unidade); changed = true; }
  });
  if (changed) { lsSet(LISTA_CAT_KEY, st.cats); lsSet(LISTA_UNI_KEY, st.unis); }
}
function upsertItem(data) {
  const i = st.items.findIndex(x => x.id === data.id);
  if (i >= 0) st.items[i] = { ...st.items[i], ...data }; else st.items.push(data);
  recalc();
}

/* ── Carregamento ────────────────────────────────────── */
let loadTimer;
async function loadAll() {
  st.loading = true; st.error = null; renderAll();
  let seg = 0; clearInterval(loadTimer);
  loadTimer = setInterval(() => { seg++; const n = $('#load-note'); if (n && seg >= 5) n.textContent = `Aguardando o servidor… (${seg}s)`; }, 1000);
  try {
    const [items, hist] = await Promise.all([api('/estoque'), api(`/historico?limite=${HIST_LIMIT}`).catch(() => [])]);
    st.items = items; st.hist = hist; st.histNote = hist.length >= 50 && (hist.length === 50 || hist.length >= HIST_LIMIT);
    recalc();
  } catch (e) {
    st.error = e.message || 'Não foi possível carregar os dados.';
  }
  clearInterval(loadTimer); st.loading = false; renderAll();
}
async function reloadHist() {
  try { st.hist = await api(`/historico?limite=${HIST_LIMIT}`); st.histNote = st.hist.length === 50 || st.hist.length >= HIST_LIMIT; } catch {}
}

/* ═══════════════ Navegação / roteamento ═══════════════ */
const NAV = [
  { href: '#/', label: 'Dashboard', icon: 'home', r: 'dashboard' },
  { group: 'Estoque', items: [
    { href: '#/estoque', label: 'Todos os materiais', icon: 'box', r: 'estoque' },
    { href: '#/estoque/critico', label: 'Estoque crítico', icon: 'alert', r: 'critico', badge: 'crit' },
    { href: '#/estoque/lotes', label: 'Lotes vencendo', icon: 'layers', r: 'lotes' } ] },
  { group: 'Movimentações', items: [
    { href: '#/movimentacoes/entradas', label: 'Entradas', icon: 'up', r: 'mov-entradas' },
    { href: '#/movimentacoes/saidas', label: 'Saídas', icon: 'down', r: 'mov-saidas' },
    { href: '#/movimentacoes/historico', label: 'Histórico', icon: 'clock', r: 'mov-historico' } ] },
  { group: 'Compras', items: [{ href: '#/compras', label: 'Lista de compras', icon: 'cart', r: 'compras', badge: 'shop' }] },
  { group: 'Análise', items: [{ href: '#/relatorios', label: 'Relatórios', icon: 'chart', r: 'relatorios' }] },
  { href: '#/configuracoes', label: 'Configurações', icon: 'settings', r: 'configuracoes' },
];
const TITLES = { dashboard: 'Dashboard', estoque: 'Materiais', critico: 'Estoque crítico', lotes: 'Lotes vencendo', 'mov-entradas': 'Entradas', 'mov-saidas': 'Saídas', 'mov-historico': 'Histórico', compras: 'Lista de compras', relatorios: 'Relatórios', configuracoes: 'Configurações' };
function route() {
  const p = (location.hash.replace(/^#/, '') || '/').replace(/\/+$/, '') || '/';
  const map = { '/': 'dashboard', '/estoque': 'estoque', '/estoque/critico': 'critico', '/estoque/lotes': 'lotes',

/* Pager */
function pager(total, page, per, act) {
  if (total <= per) return total ? `<div class="pager"><span>${total} ${pl(total, 'registro', 'registros')}</span></div>` : '';
  const pages = Math.ceil(total / per), a = (page - 1) * per + 1, b = Math.min(total, page * per);
  return `<div class="pager"><span>Mostrando ${a}–${b} de ${total}</span><div>
    <button class="btn sm" data-act="${act}" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="Página anterior">${ico('chevL', 14)} Anterior</button>
    <span style="align-self:center">${page}/${pages}</span>
    <button class="btn sm" data-act="${act}" data-p="${page + 1}" ${page >= pages ? 'disabled' : ''} aria-label="Próxima página">Próxima ${ico('chevR', 14)}</button></div></div>`;
}

    </div><div id="mat-results">${matResults()}</div></section>`;
}
function matFiltered() {
  const f = st.mat, q = norm(f.q.trim());
  let L = st.rows.filter(r =>
    (!f.cat || r.categoria === f.cat) &&
    (f.status === 'todos' || (f.status === 'risco' ? r.status !== 'normal' : r.status === f.status)) &&
    (!q || norm(r.nome).includes(q) || norm(r.categoria).includes(q)));
  const order = { critico: 0, atencao: 1, normal: 2 };
  L.sort((a, b) => {
    let x, y;
    if (f.sort === 'status') { x = order[a.status]; y = order[b.status]; if (x === y) { x = a.pct; y = b.pct; } }
    else if (['nome', 'categoria'].includes(f.sort)) { x = a[f.sort].toLowerCase(); y = b[f.sort].toLowerCase(); }
    else { x = a[f.sort]; y = b[f.sort]; }
    return (x < y ? -1 : x > y ? 1 : 0) * (f.asc ? 1 : -1);
  });
  return L;
}
function matResults() {
  const L = matFiltered(), f = st.mat, total = L.length;
  const pages = Math.max(1, Math.ceil(total / PER_PAGE)); if (f.page > pages) f.page = pages;
  const cnt = $('#mat-count'); if (cnt) cnt.textContent = `${total} ${pl(total, 'material', 'materiais')}`;
  if (!st.rows.length) return emptyState('box', 'Você ainda não possui materiais cadastrados.', 'Cadastre o primeiro material para começar.', firstMaterialBtn);
  if (!total) return emptyState('search', 'Nenhum material encontrado', 'Ajuste a busca ou os filtros para ver mais resultados.', `<button class="btn" data-act="clear-mat">Limpar filtros</button>`);
  return `<div class="tbl-wrap"><table class="rt">${matHead(true)}<tbody>${L.slice((f.page - 1) * PER_PAGE, f.page * PER_PAGE).map(r => matRow(r)).join('')}</tbody></table></div>${pager(total, f.page, PER_PAGE, 'page-mat')}`;
}

/* ── Analytics (gráfico + ranking) ───────────────────── */
function analytics(dias) {
  const d = dias || 365, now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const mode = d <= 30 ? 'day' : d <= 90 ? 'week' : 'month', nb = d === 7 ? 7 : d === 30 ? 30 : d === 90 ? 13 : 12;
  const B = Array.from({ length: nb }, (_, i) => {
    const k = nb - 1 - i;
    let label;
    if (mode === 'day') label = fmtDM(today - k * 864e5);
    else if (mode === 'week') label = fmtDM(today - k * 7 * 864e5);
    else label = new Date(now.getFullYear(), now.getMonth() - k, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
    return { label, ent: 0, sai: 0 };
  });
  const rank = {};
  st.hist.forEach(h => {
    const dt = new Date(h.criado_em), ds = Math.floor((today - new Date(dt.getFullYear(), dt.getMonth(), dt.getDate())) / 864e5);
    let idx;
    if (mode === 'day') idx = ds < nb ? nb - 1 - ds : -1;
    else if (mode === 'week') idx = ds < nb * 7 ? nb - 1 - Math.floor(ds / 7) : -1;
    else { const m = (now.getFullYear() - dt.getFullYear()) * 12 + now.getMonth() - dt.getMonth(); idx = m < nb ? nb - 1 - m : -1; }
    if (idx < 0 || ds < 0) return;
    const q = parseFloat(h.quantidade) || 0;
    if (h.tipo === 'ENTRADA') B[idx].ent += q; else B[idx].sai += q;
    const key = h.item_id ?? h.item_nome; rank[key] = rank[key] || { id: h.item_id, nome: h.item_nome, total: 0 }; rank[key].total += q;
  });
  return { B, mode, ent: B.reduce((s, b) => s + b.ent, 0), sai: B.reduce((s, b) => s + b.sai, 0), rank: Object.values(rank).sort((a, b) => b.total - a.total).slice(0, 5) };
}
function niceMax(v) { if (v <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 4 ? 4 : m <= 5 ? 5 : 10) * p; }
function chartSVG(a) {
  const W = 640, H = 240, pl_ = 40, pr = 8, pt = 10, pb = 26, n = a.B.length;
  const max = niceMax(Math.max(1, ...a.B.flatMap(b => [b.ent, b.sai]))), iw = W - pl_ - pr, ih = H - pt - pb, gw = iw / n, bw = Math.min(14, gw * .34);
  const y = v => pt + ih - (v / max) * ih, step = Math.ceil(n / 8);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas ${num(a.ent)} e saídas ${num(a.sai)} no período">`;
  for (let i = 0; i <= 4; i++) { const v = max / 4 * i; s += `<line x1="${pl_}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E2E8F0" ${i ? 'stroke-dasharray="3 3"' : ''}/><text x="${pl_ - 6}" y="${y(v) + 4}" text-anchor="end">${num(v)}</text>`; }
  a.B.forEach((b, i) => {
    const cx = pl_ + gw * i + gw / 2, x0 = pl_ + gw * i;
    s += `<g><title>${b.label}: entradas ${num(b.ent)} · saídas ${num(b.sai)}</title><rect class="hov" x="${x0}" y="${pt}" width="${gw}" height="${ih}" rx="4"/>`;
    if (b.ent) s += `<rect x="${cx - bw - 1}" y="${y(b.ent)}" width="${bw}" height="${pt + ih - y(b.ent)}" rx="2" fill="#22C55E"/>`;
    if (b.sai) s += `<rect x="${cx + 1}" y="${y(b.sai)}" width="${bw}" height="${pt + ih - y(b.sai)}" rx="2" fill="#F87171"/>`;
    if (i % step === 0 || i === n - 1 && step === 1) s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${b.label}</text>`;
    s += '</g>';
  });
  return s + '</svg>';
}
const PERIODS = [[7, '7 dias'], [30, '30 dias'], [90, '3 meses'], [365, '1 ano']];
function periodSeg(withAll = false) {
  return `<div class="seg" role="group" aria-label="Período">${PERIODS.concat(withAll ? [[0, 'Tudo']] : []).map(([d, l]) => `<button data-act="periodo" data-d="${d}" aria-pressed="${st.period === d}">${l}</button>`).join('')}</div>`;
}
function analyticsHTML(withAll = false) {
  const a = analytics(st.period), has = a.ent || a.sai, max = a.rank[0]?.total || 1;
  return `<div class="grid-2 an-wrap">
    <section class="card" aria-labelledby="h-chart"><div class="card-head"><div><h2 id="h-chart">Entradas vs Saídas</h2><p>Quantidade movimentada por ${a.mode === 'day' ? 'dia' : a.mode === 'week' ? 'semana' : 'mês'}</p></div>${periodSeg(withAll)}</div>
      ${has ? `<div class="an-tot"><div><b class="qty-in num">+${num(a.ent)}</b><span>Entradas</span></div><div><b class="qty-out num">−${num(a.sai)}</b><span>Saídas</span></div><div style="margin-left:auto;align-self:center" class="legend"><span><i style="background:#22C55E"></i>Entradas</span><span><i style="background:#F87171"></i>Saídas</span></div></div><div class="chart">${chartSVG(a)}</div>`
        : emptyState('chart', 'Sem movimentações neste período', 'Registre entradas e saídas ou escolha um período maior para ver o gráfico.')}</section>
    <section class="card" aria-labelledby="h-rank"><div class="card-head"><div><h2 id="h-rank">Materiais mais consumidos</h2><p>Por quantidade movimentada</p></div></div>
      ${a.rank.length ? `<ol class="rank">${a.rank.map((r, i) => { const it = byId(r.id); return `<li><div><span>${i + 1}. ${it ? `<button class="name-btn" data-act="detalhe" data-id="${it.id}">${esc(r.nome)}</button>` : esc(r.nome)}</span><b class="num">${num(r.total)}${it ? ' <span class="muted" style="font-weight:400">' + esc(it.unidade) + '</span>' : ''}</b></div><div class="rank-bar"><i style="width:${Math.max(4, r.total / max * 100)}%"></i></div></li>`; }).join('')}</ol>`
        : emptyState('list', 'Sem dados de consumo', 'O ranking aparece quando houver movimentações no período.')}</section></div>`;
}

/* ── Relatórios ──────────────────────────────────────── */
function relTable() {
  const lim = st.period ? Date.now() - st.period * 864e5 : 0, map = {};
  st.rows.forEach(r => map[r.id] = { id: r.id, nome: r.nome, cat: r.categoria, un: r.unidade, atual: r.atual, ent: 0, sai: 0 });
  st.hist.forEach(h => {
    if (lim && new Date(h.criado_em).getTime() < lim) return;
    const k = h.item_id ?? 'n' + h.item_nome; map[k] = map[k] || { id: null, nome: h.item_nome, cat: '—', un: '', atual: null, ent: 0, sai: 0 };
    if (h.tipo === 'ENTRADA') map[k].ent += parseFloat(h.quantidade); else map[k].sai += parseFloat(h.quantidade);
  });
  const L = Object.values(map).filter(x => x.ent || x.sai).sort((a, b) => (b.ent + b.sai) - (a.ent + a.sai));
  if (!L.length) return emptyState('file', 'Nenhuma movimentação no período', 'Escolha um período maior para ver o consumo detalhado por material.');
  return `<div class="tbl-wrap"><table class="rt"><thead><tr><th>Material</th><th>Categoria</th><th class="r">Entradas</th><th class="r">Saídas</th><th class="r">Saldo</th><th class="r">Estoque atual</th></tr></thead><tbody>${L.map(x => {
    const s = +(x.ent - x.sai).toFixed(3);

      <td class="r num qty-in" data-label="Entradas">${x.ent ? '+' + num(x.ent) : '—'}</td><td class="r num qty-out" data-label="Saídas">${x.sai ? '−' + num(x.sai) : '—'}</td>
      <td class="r num" data-label="Saldo" style="font-weight:600">${s > 0 ? '+' : s < 0 ? '−' : ''}${num(Math.abs(s))}</td><td class="r num" data-label="Estoque atual">${x.atual === null ? '—' : num(x.atual) + ' ' + esc(x.un)}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

async function saveItem(e) {

  if (ideal < minimo) return toast('Estoque ideal deve ser ≥ ao mínimo.', 'error');

    const editing = st.editId !== null;

/* Remover */
async function askDelete(id) {
  const r = byId(id); if (!r) return;
  if (!await askConfirm({ title: 'Remover material', message: `Tem certeza que deseja remover <strong>${esc(r.nome)}</strong>? O histórico de movimentações dele também será removido. Esta ação não pode ser desfeita.`, confirmText: 'Remover', danger: true })) return;
  try {
    await api(`/estoque/${id}`, { method: 'DELETE' });
    st.items = st.items.filter(i => i.id !== id); st.hist = st.hist.filter(h => h.item_id !== id); recalc();
    closeDrawerIfOpen(); renderAll(); toast('Material removido.');
  } catch (err) { toast(err.message || 'Erro ao remover.', 'error'); }
}

function persistLists() { lsSet(LISTA_CAT_KEY, st.cats); lsSet(LISTA_UNI_KEY, st.unis); fillSelects(); renderManage(); renderAll(); refreshMat(); }
async function bulkChange(field, from, to) {
  for (const it of st.items.filter(i => (i[field] || (field === 'categoria' ? DEF_CAT : DEF_UNI)) === from)) {
    try {
      const data = await api(`/estoque/${it.id}`, { method: 'PUT', body: JSON.stringify({ nome: it.nome, minimo: it.minimo, atual: it.atual, ideal: it.ideal, categoria: it.categoria || DEF_CAT, unidade: it.unidade || DEF_UNI, [field]: to }) });

}
async function mgAdd(e) {
  e.preventDefault(); const m = MG[st.mgKind], v = $('#mg-new').value.trim();

  m.list().push(v); $('#mg-new').value = ''; persistLists(); toast('Adicionado.');
}
async function mgRename(old) {
  const m = MG[st.mgKind], nv = await askText({ title: 'Renomear', label: `Novo nome para "${old}"`, value: old });
  if (!nv || nv === old) return;
  if (m.list().some(x => x.toLowerCase() === nv.toLowerCase())) return toast('Já existe um item com este nome.', 'error');
  const L = m.list(); L[L.indexOf(old)] = nv;
  await bulkChange(m.field, old, nv);
  if (st.mgKind === 'cat' && st.mat.cat === old) st.mat.cat = nv;
  persistLists(); toast('Renomeado.');

async function mgDelete(n) {
  const m = MG[st.mgKind];
  if (!await askConfirm({ title: 'Excluir', message: `Excluir <strong>${esc(n)}</strong>? Os itens que a usam voltarão para "${m.def}".`, confirmText: 'Excluir', danger: true })) return;
  m.set(m.list().filter(x => x !== n)); await bulkChange(m.field, n, m.def);
  if (st.mgKind === 'cat' && st.mat.cat === n) st.mat.cat = '';
  persistLists(); toast('Excluído.');
}

/* ═══════════════ Command palette ═══════════════ */
let pal = { mode: null, sel: 0, items: [] };
const GO = h => () => { location.hash = h; };
function palCommands() {
  return [
    { g: 'Ações', l: 'Novo material', i: 'plus', k: 'N', kw: 'criar cadastrar adicionar', run: () => openItemForm() },
    { g: 'Ações', l: 'Registrar entrada', i: 'up', kw: 'receber compra', run: () => palPick('ENTRADA') },
    { g: 'Ações', l: 'Registrar saída', i: 'down', kw: 'consumo retirar', run: () => palPick('SAÍDA') },
    { g: 'Ações', l: 'Buscar material', i: 'search', kw: 'procurar', run: () => { palSetQuery(''); return 'keep'; } },
    { g: 'Ações', l: 'Exportar lista de compras (PDF)', i: 'file', kw: 'imprimir', run: () => { location.hash = '#/compras'; setTimeout(exportPDF, 250); } },
    { g: 'Ações', l: 'Sair da conta', i: 'logout', kw: 'logout', run: logout },
    { g: 'Páginas', l: 'Dashboard', i: 'home', k: 'G D', kw: 'visão geral início', run: GO('#/') },
    { g: 'Páginas', l: 'Todos os materiais', i: 'box', k: 'G E', kw: 'estoque', run: GO('#/estoque') },
    { g: 'Páginas', l: 'Ver estoque crítico', i: 'alert', k: 'G K', kw: 'reposição baixo', run: GO('#/estoque/critico') },
    { g: 'Páginas', l: 'Lotes vencendo', i: 'layers', kw: 'validade', run: GO('#/estoque/lotes') },
    { g: 'Páginas', l: 'Entradas', i: 'up', run: GO('#/movimentacoes/entradas') },
    { g: 'Páginas', l: 'Saídas', i: 'down', run: GO('#/movimentacoes/saidas') },
    { g: 'Páginas', l: 'Histórico', i: 'clock', k: 'G H', kw: 'movimentações', run: GO('#/movimentacoes/historico') },
    { g: 'Páginas', l: 'Lista de compras', i: 'cart', k: 'G C', run: GO('#/compras') },
    { g: 'Páginas', l: 'Relatórios', i: 'chart', k: 'G R', kw: 'consumo análise', run: GO('#/relatorios') },
    { g: 'Páginas', l: 'Configurações', i: 'settings', k: 'G S', kw: 'categorias unidades conta', run: GO('#/configuracoes') },
  ];
}
function palBuild() {
  const q = norm($('#pal-input').value.trim()), toks = q.split(/\s+/).filter(Boolean), out = [];
  if (pal.mode) {
    st.rows.filter(r => toks.every(t => norm(r.nome + ' ' + r.categoria).includes(t))).slice(0, 30).forEach(r => out.push({ g: pal.mode === 'ENTRADA' ? 'Registrar entrada em…' : 'Registrar saída de…', l: r.nome, s: r.categoria, i: pal.mode === 'ENTRADA' ? 'up' : 'down', run: () => openMov(r.id, pal.mode) }));
  } else {
    palCommands().filter(c => toks.every(t => norm(c.l + ' ' + (c.kw || '')).includes(t))).forEach(c => out.push(c));
    if (toks.length) st.rows.filter(r => toks.every(t => norm(r.nome + ' ' + r.categoria).includes(t))).slice(0, 6).forEach(r => out.push({ g: 'Materiais', l: r.nome, s: `${r.categoria} · ${num(r.atual)} ${r.unidade}`, i: 'box', run: () => openDrawer(r.id) }));
  }
  pal.items = out; pal.sel = 0; palRender();
}
function palRender() {
  const L = $('#pal-list');
  if (!pal.items.length) { L.innerHTML = `<div class="empty" style="padding:28px">Nenhum resultado para essa busca.</div>`; return; }
  let g = '', h = '';
  pal.items.forEach((c, i) => {
    if (c.g !== g) { g = c.g; h += `<div class="pal-group" role="presentation">${g}</div>`; }
    h += `<button class="pal-item" role="option" id="pal-o${i}" data-pi="${i}" aria-selected="${i === pal.sel}">${ico(c.i, 16)}<span>${esc(c.l)}${c.s ? `<small>${esc(c.s)}</small>` : ''}</span>${c.k ? `<kbd>${c.k}</kbd>` : ''}</button>`;
  });
  L.innerHTML = h; $('#pal-input').setAttribute('aria-activedescendant', 'pal-o' + pal.sel);
  const cur = $('#pal-o' + pal.sel); if (cur) cur.scrollIntoView({ block: 'nearest' });
}
function palSetQuery(v) { $('#pal-input').value = v; palBuild(); }
function palPick(t) { pal.mode = t; $('#pal-input').placeholder = t === 'ENTRADA' ? 'Qual material recebeu entrada?' : 'De qual material foi a saída?'; palSetQuery(''); return 'keep'; }
function openPalette() { pal.mode = null; $('#pal-input').placeholder = 'Buscar material, página ou ação…'; $('#pal-input').value = ''; palBuild(); openDlg('#dlg-pal'); setTimeout(() => $('#pal-input').focus(), 20); }
function palRun(i) {
  const c = pal.items[i]; if (!c) return;
  const r = c.run(); if (r === 'keep') { $('#pal-input').focus(); return; }
  const d = $('#dlg-pal'); if (d.open) d.close();
}
$('#pal-input').addEventListener('input', palBuild);
$('#pal-input').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); pal.sel = Math.min(pal.items.length - 1, pal.sel + 1); palRender(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); pal.sel = Math.max(0, pal.sel - 1); palRender(); }
  else if (e.key === 'Enter') { e.preventDefault(); palRun(pal.sel); }
  else if (e.key === 'Backspace' && pal.mode && !e.target.value) { pal.mode = null; palBuild(); }
});
$('#pal-list').addEventListener('click', e => { const b = e.target.closest('[data-pi]'); if (b) palRun(+b.dataset.pi); });
$('#pal-list').addEventListener('mousemove', e => { const b = e.target.closest('[data-pi]'); if (b && +b.dataset.pi !== pal.sel) { pal.sel = +b.dataset.pi; $$('.pal-item').forEach((el, i) => el.setAttribute('aria-selected', i === pal.sel)); } });

/* Atalhos globais */
let chord = 0;
const typing = () => { const a = document.activeElement; return a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable); };
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const d = $('#dlg-pal'); d.open ? d.close() : openPalette(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || typing() || document.querySelector('dialog[open]')) return;
  const k = e.key.toLowerCase();
  if (chord && Date.now() - chord < 900) {
    const m = { d: '#/', e: '#/estoque', k: '#/estoque/critico', h: '#/movimentacoes/historico', c: '#/compras', r: '#/relatorios', s: '#/configuracoes' };
    chord = 0; if (m[k]) { e.preventDefault(); location.hash = m[k]; } return;
  }
  if (k === 'g') chord = Date.now();
  else if (k === 'n') { e.preventDefault(); openItemForm(); }
  else if (k === '/') { e.preventDefault(); openPalette(); }
});

/* ═══════════════ Toasts ═══════════════ */
function toast(msg, type = 'success') {
  const t = document.createElement('div'); t.className = `toast ${type === 'error' ? 'error' : ''}`;
  t.setAttribute('role', type === 'error' ? 'alert' : 'status');
  t.innerHTML = `${ico(type === 'error' ? 'alert' : 'check', 16)}<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 220); }, type === 'error' ? 4500 : 3000);
}

/* ═══════════════ Delegação de eventos ═══════════════ */
const ACT = {
  novo: () => openItemForm(),
  editar: el => { const d = $('#dlg-drawer'); if (d.open) d.close(); openItemForm(+el.dataset.id); },
  entrada: el => { const d = $('#dlg-drawer'); if (d.open) d.close(); openMov(+el.dataset.id, 'ENTRADA', el.dataset.qtd || ''); },
  saida: el => { const d = $('#dlg-drawer'); if (d.open) d.close(); openMov(+el.dataset.id, 'SAÍDA'); },
  remover: el => askDelete(+el.dataset.id),
  detalhe: el => { const d = $('#dlg-pal'); if (d.open) d.close(); closePops(); openDrawer(+el.dataset.id); },
  'close-dlg': el => el.closest('dialog').close(),
  ir: el => { location.hash = el.dataset.to; },
  palette: openPalette,
  menu: () => document.body.classList.toggle('nav-open'),
  reload: loadAll,
  logout,
  sort: el => { const k = el.dataset.k; if (st.mat.sort === k) st.mat.asc = !st.mat.asc; else { st.mat.sort = k; st.mat.asc = true; } st.mat.page = 1; refreshMat(); },
  'page-mat': el => { st.mat.page = +el.dataset.p; refreshMat(); },
  'page-mov': el => { st.mov.page = +el.dataset.p; refreshMov(); },
  'clear-mat': () => { Object.assign(st.mat, { q: '', cat: '', status: 'todos', page: 1 }); renderView(false); },
  'clear-mov': () => { Object.assign(st.mov, { tipo: 'todos', dias: 0, item: '', cat: '', page: 1 }); renderView(false); },
  periodo: el => { st.period = +el.dataset.d; refreshAnalytics(); },
  'pick-mov': el => { openPalette(); palPick(el.dataset.t); },
  manage: el => openManage(el.dataset.kind),
  'mg-rename': el => mgRename(el.dataset.n),
  'mg-delete': el => mgDelete(el.dataset.n),
  'shop-restore': el => { shop.excluded = shop.excluded.filter(x => x !== +el.dataset.id); saveShop(); toast('Adicionado à lista de compras.'); renderAll(); },
  'shop-remove': el => {
    const k = el.dataset.key;
    if (k[0] === 'i') shop.excluded.push(+k.slice(1)); else shop.manual = shop.manual.filter(m => 'm' + m.id !== k);
    shop.bought = shop.bought.filter(x => x !== k); saveShop(); renderAll(); toast('Removido da lista.');
  },
  'shop-bought': el => { const k = el.dataset.key; shop.bought = shop.bought.includes(k) ? shop.bought.filter(x => x !== k) : shop.bought.concat(k); saveShop(); renderAll(); },
  'shop-clear': () => {
    shop.manual = shop.manual.filter(m => !shop.bought.includes('m' + m.id)); shop.bought = []; saveShop(); renderAll();
  },
  'export-pdf': exportPDF, 'export-csv': exportCSV, 'export-copy': exportCopy,
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });

const INP = {
  'mat-q': el => { st.mat.q = el.value; st.mat.page = 1; refreshMat(); },
  'mat-cat': el => { st.mat.cat = el.value; st.mat.page = 1; refreshMat(); },
  'mat-status': el => { st.mat.status = el.value; st.mat.page = 1; refreshMat(); },
  'mat-sortsel': el => { st.mat.sort = el.value; st.mat.asc = true; st.mat.page = 1; refreshMat(); },
  'mov-tipo': el => { st.mov.tipo = el.value; st.mov.page = 1; refreshMov(); },
  'mov-dias': el => { st.mov.dias = +el.value; st.mov.page = 1; refreshMov(); },
  'mov-item': el => { st.mov.item = el.value; st.mov.page = 1; refreshMov(); },
  'mov-cat': el => { st.mov.cat = el.value; st.mov.page = 1; refreshMov(); },
  preview: updatePreview,
};
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && INP[el.dataset.in]) INP[el.dataset.in](el); });
document.addEventListener('change', e => {
  const el = e.target.closest('[data-ch]'); if (!el) return;
  const t = el.dataset.ch, k = el.dataset.key;
  if (t === 'shop-check') {
    shop.unchecked = el.checked ? shop.unchecked.filter(x => x !== k) : shop.unchecked.concat(k); saveShop(); refreshShopSummary();
    const all = $('[data-ch="shop-all"]'); if (all) all.checked = shopRows().every(isSelected);
  } else if (t === 'shop-all') {
    shop.unchecked = el.checked ? [] : shopRows().map(r => r.key); saveShop();
    $$('[data-ch="shop-check"]').forEach(c => { if (!c.disabled) c.checked = el.checked; }); refreshShopSummary();
  } else if (t === 'shop-qty') {
    const v = parseFloat(el.value); if (isNaN(v) || v < 0) { toast('Quantidade inválida.', 'error'); return renderView(false); }
    if (k[0] === 'i') shop.qty[+k.slice(1)] = v; else { const m = shop.manual.find(x => 'm' + x.id === k); if (m) m.qtd = v; }
    saveShop(); refreshShopSummary();
  }
});
$('#form-item').addEventListener('submit', saveItem);
$('#form-mov').addEventListener('submit', saveMov);
$('#form-mg').addEventListener('submit', mgAdd);
$('#f-unidade').addEventListener('change', updatePreview);
document.addEventListener('submit', e => {
  if (e.target.id !== 'form-shop') return; e.preventDefault();
  const nome = $('#sh-nome').value.trim(), qtd = parseFloat($('#sh-qtd').value);
  if (!nome || isNaN(qtd) || qtd <= 0) return toast('Informe o nome e uma quantidade válida.', 'error');
  shop.manual.push({ id: Date.now(), nome, qtd, un: $('#sh-un').value || DEF_UNI }); saveShop(); renderAll(); toast('Item adicionado à lista.');
  setTimeout(() => $('#sh-nome')?.focus(), 30);
});

/* ═══════════════ Inicialização ═══════════════ */
function init() {
  const token = localStorage.getItem('versah_token');
  let usuario = null; try { usuario = JSON.parse(localStorage.getItem('versah_usuario') || 'null'); } catch {}
  if (!token || !usuario) { window.location.href = 'login.html'; return; }
  st.user = usuario;
  st.cats = lsGet(LISTA_CAT_KEY, null) || [DEF_CAT, 'Insumos', 'Limpeza', 'Escritório', 'Materiais para Cirurgia', 'Outros'];
  st.unis = lsGet(LISTA_UNI_KEY, null) || [DEF_UNI, 'pct'];
  if (!st.cats.includes(DEF_CAT)) st.cats.unshift(DEF_CAT);
  if (!st.unis.includes(DEF_UNI)) st.unis.unshift(DEF_UNI);
  lsSet(LISTA_CAT_KEY, st.cats); lsSet(LISTA_UNI_KEY, st.unis);
  shop = Object.assign({ excluded: [], unchecked: [], bought: [], qty: {}, manual: [] }, lsGet(shopKey(), {}));
  $$('[data-ico]').forEach(el => el.innerHTML = ico(el.dataset.ico, 16));
  $('#btn-menu').innerHTML = ico('menu', 20);
  $('#btn-search').innerHTML = `${ico('search', 16)}<span>Buscar materiais, páginas e ações…</span><kbd>Ctrl K</kbd>`;
  $('#btn-novo').innerHTML = `${ico('plus', 16)}<span class="lbl-hide">Novo material</span>`;
  fillSelects(); applyRoutePresets(); loadAll();
}
init();
</script>
</body>
</html>
